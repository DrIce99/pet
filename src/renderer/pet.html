<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Pixel Pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="bubble" class="bubble" hidden>
      <button id="bubble-close" class="bubble-close" type="button" title="Chiudi" aria-label="Chiudi">×</button>
      <div id="bubble-text" class="bubble-text"></div>
    </div>
    <form id="chat" class="chat" hidden>
      <textarea id="chat-input" rows="1" maxlength="4000" placeholder="Scrivi…" aria-label="Messaggio"></textarea>
      <button id="chat-send" type="submit" title="Invia (Invio)" aria-label="Invia">➤</button>
    </form>
    <canvas id="pet" class="pet"></canvas>
    <script src="pet.js"></script>
  </body>
</html>
